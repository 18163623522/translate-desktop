<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>沉浸式免费翻译</title>
  <link rel="stylesheet" href="./fluent.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex;
      background-color: var(--f-bg);
      background-image:
        radial-gradient(620px 340px at 14% 0%, rgba(0, 120, 212, 0.10), transparent 62%),
        radial-gradient(520px 300px at 88% 4%, rgba(0, 153, 130, 0.07), transparent 60%),
        radial-gradient(700px 380px at 50% 100%, rgba(136, 96, 255, 0.07), transparent 65%);
      color: var(--f-text);
      font-family: var(--f-font);
      font-size: 14px; line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    textarea, input { user-select: text; }

    .nav {
      flex: 0 0 220px; padding: 16px 10px; display: flex; flex-direction: column; gap: 3px;
      border-right: 1px solid var(--f-stroke);
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 10px 18px; }
    .logo {
      width: 34px; height: 34px; border-radius: var(--f-radius-lg); flex: none;
      background: linear-gradient(180deg, #2E8CE8 0%, #0067C0 100%); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 8px rgba(0,103,192,.35);
    }
    .brand h1 { margin: 0; font-size: 14px; font-weight: 600; }
    .brand .ver { font-size: 11px; color: var(--f-text3); }
    .nav-foot { margin-top: auto; padding: 10px 12px 2px; font-size: 11px; color: var(--f-text3); line-height: 1.7; }

    .content { flex: 1; min-width: 0; padding: 24px 32px 40px; overflow-y: auto; max-height: 100vh; }
    .h1 { margin: 0 0 4px; font: 600 24px var(--f-font-display); letter-spacing: -0.01em; }
    .h2 { margin: 22px 0 10px; font-size: 18px; font-weight: 600; }

    .work { display: flex; flex-direction: column; gap: 10px; max-width: 860px; }
    .work textarea {
      width: 100%; min-height: 130px; box-sizing: border-box; padding: 12px 14px;
      font-family: inherit; font-size: 14px; line-height: 1.7; resize: vertical;
      border-radius: var(--f-radius); border: 1px solid var(--f-stroke2);
      border-bottom-color: var(--f-text3); background: var(--f-input); color: var(--f-text);
      outline: none;
    }
    .work textarea:focus { border-bottom: 2px solid var(--f-acc); }
    .result {
      min-height: 90px; padding: 14px 16px; font-size: 14.5px; line-height: 1.8;
      background: var(--f-card); backdrop-filter: blur(16px);
      border: 1px solid var(--f-stroke); border-radius: var(--f-radius);
      white-space: pre-wrap; word-break: break-word;
    }
    .result .ph { color: var(--f-text3); }
    .statusbar { display: flex; align-items: center; gap: 10px; min-height: 24px; font-size: 12px; color: var(--f-text2); }
    #status.ok { color: var(--f-ok); }
    #status.err { color: var(--f-err); }

    .settings { max-width: 640px; }
    .f-field { flex: none; }
    .f-field input, .f-field select { width: 200px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <aside class="nav">
    <div class="brand">
      <div class="logo"><span class="fg">&#xF2B7;</span></div>
      <div>
        <h1>沉浸式免费翻译</h1>
        <div class="ver">桌面版 v0.1.0</div>
      </div>
    </div>
    <button class="f-nav-item active" data-page="work" type="button"><span class="fg">&#xE774;</span>翻译</button>
    <button class="f-nav-item" data-page="settings" type="button"><span class="fg">&#xE713;</span>设置</button>
    <div class="nav-foot">系统音频听译 / 全局划词 / 截图 OCR<br>将在后续版本加入</div>
  </aside>

  <main class="content">
    <!-- 翻译工作台 -->
    <section data-page="work">
      <h1 class="h1">翻译</h1>
      <p class="pdesc" style="font-size:12.5px;color:var(--f-text2);margin:6px 0 14px">输入任意语言文本，翻译成设置页指定的目标语言。</p>
      <div class="work">
        <textarea id="input" placeholder="输入要翻译的文本…（Ctrl+Enter 翻译）"></textarea>
        <div class="f-field">
          <button class="f-btn acc" id="btnGo" type="button">翻译</button>
          <button class="f-btn" id="btnCopy" type="button">复制译文</button>
          <span class="statusbar"><span id="status"></span></span>
        </div>
        <div class="result" id="result"><span class="ph">译文将显示在这里。</span></div>
      </div>
    </section>

    <!-- 设置 -->
    <section data-page="settings" hidden>
      <h1 class="h1" style="margin-bottom:14px">设置</h1>
      <div class="settings">
        <h2 class="h2">服务商</h2>
        <div class="f-card">
          <div class="sc-main"><div class="sc-title">翻译服务商</div>
          <div class="sc-desc" id="provDesc"></div></div>
          <select class="f-input" id="provider" style="width:220px">
            <option value="zhipu">智谱 BigModel</option>
            <option value="mimo">小米 MiMo 开放平台</option>
            <option value="bailian">阿里云百炼</option>
            <option value="volc">火山方舟 · 豆包</option>
            <option value="siliconflow">硅基流动</option>
            <option value="gemini">Google Gemini（需代理）</option>
            <option value="groq">Groq（需代理）</option>
          </select>
        </div>
        <div class="f-card" style="margin-top:4px">
          <div class="sc-main"><div class="sc-title">API Key</div>
          <div class="sc-desc">各服务商独立保存，切换互不影响</div></div>
          <input type="password" class="f-input" id="apiKey" style="width:240px" placeholder="粘贴 Key" autocomplete="off" />
        </div>
        <div class="f-card" style="margin-top:4px">
          <div class="sc-main"><div class="sc-title">翻译模型</div>
          <div class="sc-desc" id="modelDesc"></div></div>
          <input class="f-input" id="model" list="modelList" style="width:240px" placeholder="服务商默认模型" />
          <datalist id="modelList">
            <option value="glm-5.3-flash">智谱 · 限时免费 · 多模态</option>
            <option value="glm-4.7-flash">智谱 · 免费</option>
            <option value="mimo-v2.6-flash">小米 MiMo · 付费</option>
            <option value="qwen3.8-flash">百炼 · 千问3.8</option>
            <option value="doubao-seed-1.6-flash-250815">豆包 · 每日免费</option>
            <option value="Qwen/Qwen3-8B">硅基流动 · 免费</option>
          </datalist>
        </div>
        <div class="f-card" style="margin-top:4px">
          <div class="sc-main"><div class="sc-title">目标语言</div><div class="sc-desc">译文目标语言</div></div>
          <select class="f-input" id="targetLang" style="width:180px">
            <option>简体中文</option><option>English</option><option>日本語</option><option>한국어</option>
          </select>
        </div>
        <div class="f-card" style="margin-top:4px">
          <div class="sc-main"><div class="sc-title">专有名词与游戏名保留原文</div>
          <div class="sc-desc">游戏名/软件名/人名不翻译；纯专名段落不插译文</div></div>
          <div class="f-switch on" id="swPreserve" role="switch" tabindex="0"></div>
        </div>
        <div class="actions">
          <button class="f-btn acc" id="btnSave" type="button">保存</button>
          <button class="f-btn" id="btnTest" type="button">测试连接</button>
          <span id="saveStatus"></span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
